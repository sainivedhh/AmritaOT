# Analyze maintained application source and explicitly classify automated tests.
sonar.sources=src,web/src,scripts,wsgi.py
sonar.python.version=3.11
sonar.tests=tests,web/tests

# Omit generated artifacts, local caches, dependencies, build output, and saved scan evidence.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,evidence/**,web/evidence/**
sonar.test.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,web/evidence/**

# Exclude the legacy standalone demo bundle; its maintained implementation is under web/src.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,evidence/**,web/evidence/**,static/app.js
