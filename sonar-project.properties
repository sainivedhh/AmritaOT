# Analyze maintained source and explicitly classify automated tests.
sonar.sources=src,web/src,scripts,wsgi.py
sonar.tests=tests,web/tests
sonar.python.version=3.11

# Exclude generated, vendored, cached, or captured evidence files.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,evidence/**,web/evidence/**,static/app.js
sonar.test.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,evidence/**,web/evidence/**
