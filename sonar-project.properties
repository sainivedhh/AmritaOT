# Analyze maintained application source; do not count the duplicated legacy UI bundle.
sonar.sources=src,web/src,scripts,wsgi.py
sonar.tests=tests,web/tests
sonar.python.version=3.11

# Generated, vendored, cached, legacy, and captured evidence are not maintained source.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,evidence/**,web/evidence/**,static/app.js,web/*.html,static/**,web/src/assets/**
sonar.test.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,evidence/**,web/evidence/**

# Restrict duplication comparison to first-party code. Avoid generated output and assets.
sonar.cpd.exclusions=**/static/**,static/app.js,**/dist/**,**/build/**,**/node_modules/**,**/evidence/**,web/src/assets/**
