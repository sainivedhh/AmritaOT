apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iems-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: iems-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway
    ports:
    - protocol: TCP
      port: 5000
