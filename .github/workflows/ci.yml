name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install -r k8s/requirements.txt
    - name: Run Pytest
      run: pytest tests/
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: Install frontend dependencies
      working-directory: web
      run: npm ci
    - name: Test frontend
      working-directory: web
      run: npm test
    - name: Build frontend
      working-directory: web
      run: npm run build
    - name: Run Bandit Security Scan
      run: bandit -r src/
    - name: Upgrade setuptools to patched version
      run: python -m pip install --upgrade 'setuptools>=83.0.0'
    - name: Run Pip-Audit
      run: pip-audit
