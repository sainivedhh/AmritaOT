name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        pip install -r k8s/requirements.txt
    - name: Run Pytest
      run: pytest tests/
    - name: Run Bandit Security Scan
      run: bandit -r src/
    - name: Run Pip-Audit
      run: pip-audit
