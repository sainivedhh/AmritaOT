# Keep SonarCloud focused on maintained application code and classify tests separately.
sonar.sources=src,static,web/src,scripts,wsgi.py
sonar.tests=tests,web/tests

# Generated artifacts, saved scan output, caches, and vendored/build output are not source code.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/node_modules/**,**/dist/**,**/build/**,evidence/**,web/evidence/**
sonar.test.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,web/evidence/**
